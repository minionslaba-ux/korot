<style>
/* Layout: casual mobile game. Home = restored post office scene + level path; Level = HUD (moves, goals) beside or above an 8×8 board. Single evening-forest look by choice. */
:root{
  --night:#16303a;     /* page ground, evening forest */
  --night-2:#1e3e49;
  --moss:#2f5a4a;
  --bark:#6b4a33;
  --bark-2:#8a6244;
  --paper:#fff6e6;     /* envelopes, panels text */
  --paper-dim:#c9d6cf;
  --amber:#ffb84a;     /* accent: stamps, buttons */
  --amber-2:#ffd27f;
  --berry:#ff5d5d;
  --ok:#7be08a;
  --display:'Comfortaa','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cell:56px;
  color-scheme:dark;
}
html,body{height:100%}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--night-2),var(--night) 70%);background-color:var(--night);color:var(--paper);font-family:var(--body);font-size:15px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--amber-2);outline-offset:2px}
.screen{min-height:100%;box-sizing:border-box;padding-block:max(14px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border-radius:14px;padding:12px 18px;font-weight:800;background:var(--night-2);border:2px solid var(--moss);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.btn.main{background:linear-gradient(var(--amber-2),var(--amber));color:#3a2410;border-color:#c98420;font-family:var(--display);font-size:17px;box-shadow:0 4px 0 #b06d12}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance}
.star{color:var(--amber)}

/* ---------- home ---------- */
.home{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.home{grid-template-columns:minmax(0,1fr)}}
.home h1{font-size:clamp(26px,5vw,38px);grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.home h1 small{font-family:var(--body);font-size:14px;font-weight:700;color:var(--paper-dim)}
.scene{border-radius:20px;overflow:hidden;border:2px solid var(--moss);background:var(--night-2);aspect-ratio:400/270;max-width:100%}
.scene svg{display:block;width:100%;height:100%}
.part{transition:opacity .6s,transform .6s;transform-box:fill-box;transform-origin:50% 100%}
.part.off{opacity:0;transform:scale(.6)}
.panel{background:color-mix(in srgb,var(--night-2) 85%,transparent);border:2px solid var(--moss);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:16px}
.bank{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bank b{font-family:var(--display);font-size:24px}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--moss)}
.item:last-child{border-bottom:0}
.item span{font-weight:700}
.item .done{color:var(--ok);font-weight:800;font-size:13px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:50%;background:var(--night);border:2px solid var(--moss);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:16px;line-height:1}
.lv small{font-size:9px;letter-spacing:-1px;color:var(--amber);margin-top:2px;min-height:9px}
.lv.cur{border-color:var(--amber);box-shadow:0 0 0 3px color-mix(in srgb,var(--amber) 35%,transparent)}
.lv:disabled{opacity:.35}
.story{color:var(--paper-dim);line-height:1.45;font-size:14px;max-width:60ch}

/* ---------- level ---------- */
.game{display:flex;gap:18px;align-items:flex-start;justify-content:center}
.hud{display:flex;flex-direction:column;gap:10px;width:220px;flex:none}
.game.portrait{flex-direction:column;align-items:center}
.game.portrait .hud{width:100%;max-width:calc(var(--cell) * 8 + 16px);flex-direction:row;flex-wrap:wrap;gap:8px}
.box{background:var(--night-2);border:2px solid var(--moss);border-radius:14px;padding:10px 12px}
.box .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-dim)}
.moves{font-family:var(--display);font-size:34px;line-height:1.1}
.moves.low{color:var(--berry)}
.goals{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.goal{display:flex;align-items:center;gap:4px;font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.goal .ic{width:28px;height:28px;display:block}
.goal .ic svg{width:100%;height:100%;display:block}
.goal.done{color:var(--ok)}
.game.portrait .box.mv{flex:0 0 auto}
.game.portrait .box.gl{flex:1 1 160px}
.game.portrait .box.sc{display:none}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.game.portrait .tools{width:100%;flex-wrap:nowrap;justify-content:center;gap:18px}
.tools{justify-content:center;gap:14px;padding:4px 0}
.game.portrait .tool{min-width:0;padding:0 4px}
@media (max-width:360px){.home h1 .btn.replay{font-size:0;min-width:44px}.home h1 .btn.replay::before{content:"▶";font-size:14px}}
.tool{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.tool.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 22%,var(--night-2))}
.tool b{background:var(--amber);color:#3a2410;border-radius:8px;padding:0 6px;font-size:12px}
.scorev{font-family:var(--display);font-size:20px}

.boardwrap{padding:8px;border-radius:18px;background:var(--bark);box-shadow:inset 0 0 0 3px var(--bark-2),0 10px 30px -10px #000}
.board{position:relative;width:calc(var(--cell) * 8);height:calc(var(--cell) * 8);overflow:hidden;border-radius:12px;touch-action:none;
  background-color:#2a4a3c;
  background-image:conic-gradient(#ffffff0d 25%,transparent 0 50%,#ffffff0d 0 75%,transparent 0);
  background-size:calc(var(--cell) * 2) calc(var(--cell) * 2)}
.mossc{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);border-radius:22%;
  background:radial-gradient(circle at 30% 30%,#9be27a,#4f9b47 60%,#3b7a37);box-shadow:inset 0 0 0 2px #2f6a2c;opacity:.9;transition:opacity .3s,transform .3s;transform-origin:center}
.mossc.gone{opacity:0;transform:scale(.4)}
.t{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition-property:transform;transition-timing-function:cubic-bezier(.5,0,.75,1);will-change:transform}
.t .g{position:absolute;inset:9%;transition:transform .15s}
.t .g svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 1px #0006)}
.t.sel .g{transform:scale(1.15)}
.t.sel::before{content:"";position:absolute;inset:3%;border-radius:22%;background:#ffffff26;box-shadow:inset 0 0 0 2px #fff8}
.t.hint .g{animation:wig .6s ease-in-out infinite}
@keyframes wig{25%{transform:rotate(-10deg) scale(1.08)}75%{transform:rotate(10deg) scale(1.08)}}
.t.pop .g{animation:pop .2s ease-in forwards}
@keyframes pop{30%{transform:scale(1.2)}to{transform:scale(0);opacity:0}}
.t.sp-h::after,.t.sp-v::after{content:"";position:absolute;border-radius:6px;pointer-events:none}
.t.sp-h::after{inset:36% 4%;background:repeating-linear-gradient(90deg,#fff 0 4px,transparent 4px 8px);opacity:.85;box-shadow:0 0 8px #fff}
.t.sp-v::after{inset:4% 36%;background:repeating-linear-gradient(0deg,#fff 0 4px,transparent 4px 8px);opacity:.85;box-shadow:0 0 8px #fff}
.t.sp-bomb::after{content:"";position:absolute;inset:2%;border-radius:50%;border:3px dashed #fff;animation:spin 4s linear infinite;box-shadow:0 0 10px #fff8,inset 0 0 10px #fff8}
.rb{position:absolute;inset:4%;border-radius:50%;background:conic-gradient(#ff5d5d,#ffd23f,#5fd068,#4aa8ff,#b76cff,#ff5d5d);box-shadow:inset 0 0 0 4px #ffffff70,0 0 12px #fff;animation:spin 3s linear infinite}
.rb::after{content:"✉";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cell) * .38);color:#fff;text-shadow:0 1px 3px #0008;animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.lk{position:absolute;inset:0;pointer-events:none}
.lk svg{width:100%;height:100%}
.t.hp2 .g svg{filter:brightness(.8) drop-shadow(0 0 0 #000) drop-shadow(0 2px 1px #0006)}
.beam{position:absolute;pointer-events:none;background:linear-gradient(var(--dir,90deg),transparent,#fff 45%,#fff 55%,transparent);animation:beam .35s ease-out forwards;mix-blend-mode:screen}
@keyframes beam{from{opacity:1}to{opacity:0}}
.ring{position:absolute;pointer-events:none;border-radius:50%;border:4px solid #fff;animation:ring .35s ease-out forwards}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.1);opacity:0}}
.combo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:calc(var(--cell) * .55);color:var(--amber-2);text-shadow:0 3px 0 #7a4a10,0 0 12px #000;pointer-events:none;animation:cb .9s ease-out forwards;white-space:nowrap}
@keyframes cb{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}20%{transform:translate(-50%,-50%) scale(1.1);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50000;background:#0b1a1fcc;backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov[hidden]{display:none}
.card{width:100%;max-width:420px;background:var(--paper);color:#3a2a1c;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;position:relative;
  box-shadow:0 0 0 6px #fff6e633,0 20px 50px -10px #000;
  background-image:repeating-linear-gradient(135deg,#e85d5d 0 12px,#fff6e6 12px 24px,#4a8fd8 24px 36px,#fff6e6 36px 48px);background-size:100% 8px;background-repeat:no-repeat}
.card h2{font-size:24px;color:#3a2a1c}
.card p{margin:0;line-height:1.45}
.card .to{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#a0612a}
.card .goals .goal{color:#3a2a1c}
.card .row{display:flex;gap:8px;flex-wrap:wrap}
.card .row .btn{flex:1}
.card .btn:not(.main){background:#efe2c9;border-color:#d8c3a0;color:#3a2a1c}
.card .note{font-size:12px;color:#8a7358}
.bigstars{font-size:44px;letter-spacing:6px;text-align:center;line-height:1}
.bigstars .off{color:#d9c9ad}
.stamp{position:absolute;right:18px;top:18px;width:54px;height:62px;border:3px dashed #c98420;border-radius:6px;display:flex;align-items:center;justify-content:center;transform:rotate(8deg);font-size:28px;background:#ffe9c2}
.toast{z-index:60000!important;position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--amber-2);color:#3a2410;font-weight:900;padding:10px 16px;border-radius:12px;z-index:30;white-space:nowrap}

/* ===== skin: Kenney Puzzle Pack 2 + UI Pack, sunny candy look ===== */
:root{
  --sky:#5ab4f5; --sky-2:#2f7fd6; --grass:#6cc24a; --ink:#2b3a55; --ink-dim:#61708c;
  --panel:#ffffff; --panel-2:#eef4fb; --gold:#ffc83d; --ok:#4cbf4c; --berry:#ff5a5a;
  --display:'Balsamiq Sans','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
  color-scheme:light;
}
body{background:linear-gradient(#8fd3ff 0%,var(--sky) 45%,var(--sky-2) 100%);background-color:var(--sky);color:var(--ink);background-attachment:fixed}
body::after{content:"";position:fixed;inset:auto 0 0 0;height:22vh;pointer-events:none;z-index:-1;
  background:radial-gradient(60% 100% at 20% 100%,#7fd35c 60%,transparent 61%),radial-gradient(70% 100% at 85% 100%,#6cc24a 60%,transparent 61%)}
h1,h2{font-family:var(--display);font-weight:900;letter-spacing:.01em}
.btn{border:0;border-style:solid;border-width:12px 12px 16px;border-image:url(assets/btn_grey.png) 12 12 16 fill / 12px 12px 16px stretch;
  background:none;border-radius:0;padding:0 10px;min-height:44px;color:var(--ink);font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1;text-shadow:0 1px 0 #ffffff80}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.main{border-image-source:url(assets/btn_yellow.png);background:none;box-shadow:none;color:#5a3a00;font-size:18px}
.btn.small{border-image-source:url(assets/btn_green.png);color:#fff;text-shadow:0 1px 0 #2a7a2a;font-size:14px;min-height:38px;padding:0 6px}
.btn.small:disabled{border-image-source:url(assets/btn_grey.png);color:var(--ink-dim);text-shadow:none;opacity:.8}
.panel,.box{background:var(--panel);border:0;border-radius:18px;box-shadow:0 5px 0 #c9d8ea,0 10px 24px -8px #0b3a7a66;color:var(--ink)}
.panel h2{color:var(--ink)}
.story{color:var(--ink-dim)}
.home>div>.story{color:#f2f9ff;text-shadow:0 1px 2px #0b3a7a80}
.home h1{color:#fff;-webkit-text-stroke:6px #1f5fae;paint-order:stroke fill;text-shadow:0 4px 0 #1f5fae,0 8px 16px #0b3a7a80;letter-spacing:.01em}
.home h1 .btn{-webkit-text-stroke:0}
.igate h1,.ititle h1{-webkit-text-stroke:8px #1f5fae;paint-order:stroke fill}
.home h1 small{color:#eaf6ff;text-shadow:none}
.scene{border:0;box-shadow:0 6px 0 #1f5fae,0 14px 30px -10px #0b3a7a99;border-radius:22px}
.bank b{color:var(--ink)}
.ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.18em;object-fit:contain}
.item{border-bottom:2px dashed var(--panel-2)}
.item span{color:var(--ink)}
.item .done{color:var(--ok)}
.lv{border:0;border-radius:0;background:url(assets/sq_blue.png) center/100% 100% no-repeat;color:#fff;text-shadow:0 2px 0 #1b5fa8;font-family:var(--display);font-size:20px;padding-bottom:4px}
.lv.cur{background-image:url(assets/sq_yellow.png);color:#6a4300;text-shadow:0 1px 0 #fff8;box-shadow:none;animation:bob 1.2s ease-in-out infinite}
.lv:disabled{background-image:url(assets/sq_grey.png);color:#9aa6b8;text-shadow:none;opacity:1}
.lv small{display:flex;gap:1px;min-height:11px;margin-top:3px}
.lv small img{width:11px;height:11px}
@keyframes bob{50%{transform:translateY(-3px)}}
.box .k{color:var(--ink-dim)}
.moves{font-family:var(--display);font-weight:900;font-size:40px;color:var(--ink)}
.moves.low{color:var(--berry);animation:bob .6s ease-in-out infinite}
.goal{color:var(--ink);font-family:var(--display);font-weight:800}
.goal .ic{width:32px;height:32px;position:relative}
.goal .ic img{width:100%;height:100%;object-fit:contain;display:block}
.goal.done{color:var(--ok)}
.scorev{font-family:var(--display);font-weight:900;color:var(--ink)}
.tool{min-height:48px}

const CELL_H=54;
function layout(){
  const vw=innerWidth,vh=innerHeight;
  const portrait=vw<760||vh>vw*1.05;
  const g=$('game');if(g)g.classList.toggle('portrait',portrait);

function fillBoard(map){
  for(let tries=0;tries<100;tries++){
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]&&grid[r][c].el)grid[r][c].el.remove();grid[r][c]=null}

      const ch=map[r][c];
      if('sSx'.includes(ch)){grid[r][c]=mk({stone:true,hp:ch==='S'?2:1,color:-2},r,c);continue}
      if(ch==='p'){grid[r][c]=mk({parcel:true,color:-3},r,c);continue}
      if(ch==='h'){grid[r][c]=mk({hero:true,color:-4},r,c);continue}
      let col,guard=0;
      do{col=randColor();guard++}while(guard<30&&((c>=2&&cc(r,c-1)===col&&cc(r,c-2)===col)||(r>=2&&cc(r-1,c)===col&&cc(r-2,c)===col)));
      grid[r][c]=mk({color:col,lock:'lL'.includes(ch)},r,c);
    }
    if(hasMoves())break;
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)place(grid[r][c],0);
}
function cc(r,c){const t=grid[r][c];return t&&!t.stone&&t.color>=0?t.color:-1}
function mk(o,r,c){
  const t={id:uid++,color:0,sp:null,lock:false,stone:false,hp:0,...o,r,c};

}

  const g=t.hero?HERO_T:t.parcel?PARCEL:t.stone?(t.hp>1?BOULDER:STONE):t.sp==='rb'?'<div class="rb"></div>':(t.sp?TILE_SP[t.color]:TILE[t.color]);

function place(t,dur,row){

  $('sc').textContent=score.toLocaleString('ru-RU');

/* ---------- поиск совпадений ---------- */
function findRuns(){
  const runs=[];
  for(let r=0;r<N;r++){let c=0;while(c<N){const k=cc(r,c);let e=c+1;if(k>=0){while(e<N&&cc(r,e)===k)e++;if(e-c>=3){const cells=[];for(let x=c;x<e;x++)cells.push([r,x]);runs.push({dir:'h',color:k,cells})}}c=e}}
  for(let c=0;c<N;c++){let r=0;while(r<N){const k=cc(r,c);let e=r+1;if(k>=0){while(e<N&&cc(e,c)===k)e++;if(e-r>=3){const cells=[];for(let y=r;y<e;y++)cells.push([y,c]);runs.push({dir:'v',color:k,cells})}}r=e}}
  return runs;
}
const movable=t=>t&&!t.stone&&!t.lock;
function swapGrid(r1,c1,r2,c2){const a=grid[r1][c1],b=grid[r2][c2];grid[r1][c1]=b;grid[r2][c2]=a;if(a){a.r=r2;a.c=c2}if(b){b.r=r1;b.c=c1}}
function findMove(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const [dr,dc] of [[0,1],[1,0]]){
    const r2=r+dr,c2=c+dc;if(!inb(r2,c2))continue;const a=grid[r][c],b=grid[r2][c2];
    if(!movable(a)||!movable(b))continue;
    if(a.sp==='rb'||b.sp==='rb'||(a.sp&&b.sp))return [r,c,r2,c2];
    swapGrid(r,c,r2,c2);const ok=findRuns().length>0;swapGrid(r,c,r2,c2);
    if(ok)return [r,c,r2,c2];
  }
  return null;
}
const hasMoves=()=>!!findMove();

function planMatch(runs,swapKeys){
  const hits=[],spawns=[],used=new Set(),taken=new Set();
  const hR=runs.filter(r=>r.dir==='h'),vR=runs.filter(r=>r.dir==='v');
  for(const a of hR)for(const b of vR){
    if(a.color!==b.color||used.has(a)||used.has(b))continue;
    const s=a.cells.find(([r,c])=>b.cells.some(([r2,c2])=>r2===r&&c2===c));
    if(s){used.add(a);used.add(b);taken.add(s[0]*N+s[1]);spawns.push({r:s[0],c:s[1],sp:(a.cells.length>=5||b.cells.length>=5)?'rb':'bomb'})}
  }
  for(const run of runs){
    for(const cell of run.cells)hits.push(cell);
    if(used.has(run))continue;
    const len=run.cells.length;if(len<4)continue;
    let pos=(swapKeys&&run.cells.find(([r,c])=>swapKeys.has(r*N+c)))||run.cells[len>>1];
    if(grid[pos[0]][pos[1]].sp||taken.has(pos[0]*N+pos[1])){pos=run.cells.find(([r,c])=>!grid[r][c].sp&&!taken.has(r*N+c));if(!pos)continue}
    taken.add(pos[0]*N+pos[1]);
    spawns.push({r:pos[0],c:pos[1],sp:len>=5?'rb':(run.dir==='h'?'h':'v')});
  }
  return {hits,spawns};
}
function mostColor(){
  const cnt=Array(5).fill(0);for(const row of grid)for(const t of row)if(t&&!t.stone&&t.color>=0)cnt[t.color]++;
  return cnt.indexOf(Math.max(...cnt));
}
function area(t,r,c){
  const out=[];
  if(t.sp==='h')for(let x=0;x<N;x++)out.push(r*N+x);
  else if(t.sp==='v')for(let y=0;y<N;y++)out.push(y*N+c);
  else if(t.sp==='bomb'){for(let y=r-1;y<=r+1;y++)for(let x=c-1;x<=c+1;x++)if(inb(y,x))out.push(y*N+x)}
  else if(t.sp==='rb'){const col=mostColor();for(let y=0;y<N;y++)for(let x=0;x<N;x++){const u=grid[y][x];if(u&&u.color===col)out.push(y*N+x)}}
  return out;
}
function sprite(cls,css,src){const e=document.createElement(src?'img':'div');e.className=cls;if(src){e.src=src;e.alt=''}Object.assign(e.style,css);$('board').appendChild(e);return e}
function burst(r,c,color,n){
  if(!SPEED)return;

  for(let i=0;i<n;i++){

      {duration:420+Math.random()*260,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>p.remove();

function floatNum(r,c,txt){

function shake(){if(!SPEED)return;const w=document.querySelector('.boardwrap');if(!w)return;w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
function fx(t,r,c){

function fxOld(t,r,c){

  const mkEl=(cls,css)=>{const e=document.createElement('div');e.className=cls;Object.assign(e.style,css);b.appendChild(e);setTimeout(()=>e.remove(),400)};

async function applyHits(list,spawns,fromMatch,mult){
  const spawnKeys=new Set(spawns.map(s=>s.r*N+s.c));
  const queue=list.map(([r,c])=>r*N+c);
  if(fromMatch){for(const k of [...queue]){const r=k/N|0,c=k%N;for(const [dr,dc] of D4){const y=r+dr,x=c+dc;if(inb(y,x)&&grid[y][x]&&grid[y][x].stone)queue.push(y*N+x)}}}
  const done=new Set(),removed=[];let big=false;
  while(queue.length){
    const k=queue.shift();if(done.has(k))continue;done.add(k);
    const r=k/N|0,c=k%N;
    if(moss[r][c]){moss[r][c]--;const me=mossEl[r][c];if(!moss[r][c]){me.classList.add('gone');goalAdd('m')}else{me.classList.remove('snow');me.classList.remove('melt');void me.offsetWidth;me.classList.add('melt')}score+=20}
    const t=grid[r][c];if(!t)continue;
    if(spawnKeys.has(k)){if(t.lock){t.lock=false;goalAdd('l')}continue}
    if(t.parcel||t.hero)continue;
    if(t.stone){t.hp--;score+=30;if(t.hp<=0){grid[r][c]=null;removed.push(t);goalAdd('s')}else renderTile(t);continue}
    if(t.lock){t.lock=false;goalAdd('l');score+=20;renderTile(t);continue}
    grid[r][c]=null;removed.push(t);goalAdd('c',t.color);score+=10*mult;
    if(t.sp){big=true;fx(t,r,c);for(const kk of area(t,r,c))queue.push(kk)}
  }
  for(const s of spawns){const t=grid[s.r][s.c];if(t){t.sp=s.sp;if(s.sp==='rb')t.color=-1;renderTile(t)}}
  removed.forEach(t=>{t.el.classList.add('pop');burst(t.r,t.c,t.stone?-1:t.color,removed.length>12?2:4)});
  if(removed.length){pop(mult);const m=removed[removed.length>>1];floatNum(m.r,m.c,'+'+(removed.length*10*mult))}
  updateHUD();
  await sleep(big?280:210);
  removed.forEach(t=>t.el.remove());
}
async function gravity(){
  let maxD=0;const fresh=[];
  for(let c=0;c<N;c++){
    let w=N-1;
    for(let r=N-1;r>=0;r--){const t=grid[r][c];if(t){if(w!==r){grid[w][c]=t;grid[r][c]=null;t.r=w;const d=w-r;maxD=Math.max(maxD,d);place(t,110+d*55)}w--}}
    const holes=w+1;
    for(let r=w;r>=0;r--){
      const t=mk({color:randColor()},r,c);grid[r][c]=t;
      place(t,0,r-holes);fresh.push([t,holes]);
      maxD=Math.max(maxD,holes);
    }
  }
  if(fresh.length&&SPEED)void $('board').offsetWidth;
  for(const [t,d] of fresh)place(t,110+d*55);
  await sleep(130+maxD*55);
  if(SPEED&&maxD)for(const row of grid)for(const t of row)if(t){t.el.classList.remove('land');void 0;t.el.classList.add('land');setTimeout(()=>t.el.classList.remove('land'),240)}
}
async function collectParcels(){
  const got=[];
  for(let c=0;c<N;c++){const t=grid[N-1][c];if(t&&t.parcel){grid[N-1][c]=null;got.push(t);goalAdd('p');score+=200}}
  let heroGot=null;
  if(LV.house!=null){const t=grid[N-1][LV.house];if(t&&t.hero){grid[N-1][LV.house]=null;heroGot=t;goalAdd('h');score+=500}}
  if(heroGot){
    const t=heroGot;burst(t.r,t.c,1,14);floatNum(t.r,t.c,'+500');
    t.el.style.transition='transform .55s cubic-bezier(.3,1.4,.5,1)';t.el.style.transform=`translate(${t.c*CELL}px,${(t.r+.85)*CELL}px) scale(.9)`;
    if(SPEED){sfx('friend',.8);comboText('Письмо вручено!');const hp=$('housePet');if(hp){hp.classList.remove('yay');void hp.offsetWidth;hp.classList.add('yay')}}
    updateHUD();await sleep(600);t.el.remove();
    if(!got.length)return true;
  }
  if(!got.length)return false;
  for(const t of got){burst(t.r,t.c,1,8);floatNum(t.r,t.c,'+200');t.el.style.transitionDuration='350ms';t.el.style.transform=`translate(${t.c*CELL}px,${(t.r+1)*CELL}px)`;t.el.style.opacity='0';t.el.style.transition='transform .35s ease-in,opacity .35s'}
  if(SPEED){sfx('build',.6);comboText('Посылка доставлена!')}
  updateHUD();await sleep(380);got.forEach(t=>t.el.remove());
  return true;
}
async function resolve(swapKeys){
  let cascade=0;
  while(true){
    const runs=findRuns();if(!runs.length){if(await collectParcels()){await gravity();continue}break}
    cascade++;
    const {hits,spawns}=planMatch(runs,cascade===1?swapKeys:null);
    if(cascade===3&&SPEED)comboText('Здорово!');
    if(cascade===5&&SPEED)comboText('Невероятно!');
    await applyHits(hits,spawns,true,cascade);
    await gravity();
  }
}
async function afterMove(){
  if(goalsDone()){await sleep(300);return win()}
  if(moves<=0)return lose();
  if(!hasMoves()){toast('Ходов нет — перемешиваю');await shuffleBoard()}
  armHint();
}

/* ---------- ход ---------- */
async function trySwap(r1,c1,r2,c2){
  if(busy||!inb(r2,c2))return;
  hideTut();
  const a=grid[r1][c1],b=grid[r2][c2];
  clearSel();clearHint();
  if(!movable(a)||!movable(b)){if(SPEED)toast(a&&a.lock||b&&b.lock?'Фишка во льду: собери с ней ряд':'Камень не двигается');return}
  busy=true;
  if((a.hero||b.hero)&&r1===r2){
    swapGrid(r1,c1,r2,c2);place(a,180);place(b,180);await sleep(190);
    moves--;updateHUD();if(SPEED)tick();
    await resolve(null);busy=false;await afterMove();return;
  }
  swapGrid(r1,c1,r2,c2);place(a,150);place(b,150);await sleep(160);
  const combo=a.sp==='rb'||b.sp==='rb'||(a.sp&&b.sp);
  if(combo){moves--;updateHUD();await doCombo(a,b);await resolve(null)}
  else if(findRuns().length){moves--;updateHUD();swish();await resolve(new Set([r1*N+c1,r2*N+c2]))}
  else{swapGrid(r1,c1,r2,c2);place(a,150);place(b,150);if(SPEED)nope();await sleep(160);busy=false;armHint();return}
  busy=false;await afterMove();
}
async function doCombo(a,b){
  const hits=[];const rb=a.sp==='rb'?a:b.sp==='rb'?b:null;
  if(rb){
    const o=rb===a?b:a;
    if(o.sp==='rb'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)hits.push([r,c]);if(SPEED)comboText('Весь лес!')}
    else{
      const col=o.color;const targets=[];
      for(const row of grid)for(const t of row)if(t&&!t.stone&&t.color===col)targets.push(t);
      if(o.sp){for(const t of targets){if(!t.lock&&!t.sp)t.sp=o.sp==='bomb'?'bomb':(Math.random()<.5?'h':'v');renderTile(t)}if(SPEED)comboText('Цепная реакция!');await sleep(300)}
      for(const t of targets)hits.push([t.r,t.c]);
    }
    rb.sp=null;rb.color=-1;hits.push([rb.r,rb.c]);
  }else{
    const s=[a.sp,b.sp].sort().join('+');const r=b.r,c=b.c;a.sp=null;b.sp=null;
    const row=y=>{for(let x=0;x<N;x++)hits.push([y,x])},colm=x=>{for(let y=0;y<N;y++)hits.push([y,x])};
    if(s==='bomb+bomb'){for(let y=r-2;y<=r+2;y++)for(let x=c-2;x<=c+2;x++)if(inb(y,x))hits.push([y,x])}
    else if(s.includes('bomb')){for(let d=-1;d<=1;d++){if(inb(r+d,0))row(r+d);if(inb(0,c+d))colm(c+d)}}
    else{row(r);colm(c)}
    hits.push([a.r,a.c]);
    if(SPEED){fx({sp:'h'},r,c);fx({sp:'v'},r,c);comboText('Комбо!')}
  }
  await applyHits(hits,[],false,2);
  await gravity();
}
async function hammerAt(r,c){
  if(busy||!grid[r][c])return;
  if(grid[r][c].parcel){toast('Посылку молотком не разбить: доведи её до низа');return}
  if(grid[r][c].hero){toast('Тишу молотком? Ни за что!');return}
  tool=null;P.hammers--;save();busy=true;clearHint();track('booster_use',{id:'hammer',level:LI+1});
  if(SPEED)fx({sp:'bomb'},r,c);
  await applyHits([[r,c]],[],false,1);await gravity();await resolve(null);
  busy=false;updateHUD();await afterMove();
}
async function shuffleBoard(){
  const ts=[];for(const row of grid)for(const t of row)if(t&&!t.stone&&!t.sp&&!t.parcel&&!t.hero)ts.push(t);
  for(let i=0;i<60;i++){
    const cols=ts.map(t=>t.color);for(let j=cols.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[cols[j],cols[k]]=[cols[k],cols[j]]}
    ts.forEach((t,j)=>t.color=i>30?randColor():cols[j]);
    if(!findRuns().length&&hasMoves())break;
  }
  ts.forEach(t=>{renderTile(t);t.el.classList.add('pop');});
  await sleep(180);ts.forEach(t=>t.el.classList.remove('pop'));
  await resolve(null);
}

/* ---------- управление ---------- */
let drag=null;
function cellAt(e){const b=$('board').getBoundingClientRect();return [Math.floor((e.clientY-b.top)/CELL),Math.floor((e.clientX-b.left)/CELL)]}
function clearSel(){if(sel){const s=sel;sel=null;renderTile(s)}}
function bindBoard(){
  const b=$('board');
  b.addEventListener('pointerdown',e=>{
    if(busy)return;ac();
    const [r,c]=cellAt(e);if(!inb(r,c))return;
    if(tool==='hammer'){hammerAt(r,c);return}
    drag={r,c,x:e.clientX,y:e.clientY,moved:false};
    try{b.setPointerCapture(e.pointerId)}catch(_){}
  });
  b.addEventListener('pointermove',e=>{
    if(!drag||drag.moved)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))<CELL*.35)return;
    drag.moved=true;
    const [dr,dc]=Math.abs(dx)>Math.abs(dy)?[0,Math.sign(dx)]:[Math.sign(dy),0];
    trySwap(drag.r,drag.c,drag.r+dr,drag.c+dc);
  });
  b.addEventListener('pointerup',()=>{
    if(!drag)return;const {r,c,moved}=drag;drag=null;if(moved||busy)return;
    const t=grid[r][c];
    if(sel&&Math.abs(sel.r-r)+Math.abs(sel.c-c)===1){const s=sel;trySwap(s.r,s.c,r,c);return}
    clearSel();if(t&&movable(t)){sel=t;renderTile(t);tick()}
  });
  b.addEventListener('pointercancel',()=>{drag=null});
}
function clearHint(){clearTimeout(hintTimer);document.querySelectorAll('.t.hint').forEach(e=>e.classList.remove('hint'))}
function armHint(){clearHint();if(!SPEED)return;hintTimer=setTimeout(()=>{if(busy||$('level').hidden)return;const m=findMove();if(m){grid[m[0]][m[1]].el.classList.add('hint');grid[m[2]][m[3]].el.classList.add('hint')}},5000)}

/* ---------- фоновая музыка: бесшовный повтор через Web Audio ---------- */
const MUS_VOL={home:.5,level1:.28,level2:.26};
const mus={buf:{},src:null,gain:null,cur:null,want:null};
const musExt=(()=>{try{return new Audio().canPlayType('audio/ogg; codecs="vorbis"')?'ogg':'mp3'}catch(e){return 'mp3'}})();
async function loadMus(n){
  if(!mus.buf[n])mus.buf[n]=fetch('assets/music/'+n+'.'+musExt).then(r=>r.arrayBuffer()).then(b=>new Promise((ok,no)=>AC.decodeAudioData(b,ok,no)));
  return mus.buf[n];
}
function stopMusic(){
  if(mus.gain&&AC){const g=mus.gain,s=mus.src;g.gain.cancelScheduledValues(AC.currentTime);g.gain.setTargetAtTime(0,AC.currentTime,.35);setTimeout(()=>{try{s.stop()}catch(e){}},1800)}
  mus.src=null;mus.gain=null;mus.cur=null;
}
async function playMusic(n){
  mus.want=n;
  if(!AC||!SPEED||P.musicOff||mus.cur===n)return;
  stopMusic();mus.cur=n;
  let buf;try{buf=await loadMus(n)}catch(e){mus.cur=null;return}
  if(mus.cur!==n||P.musicOff)return;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const g=AC.createGain();g.gain.value=0;g.gain.setTargetAtTime(MUS_VOL[n]||.3,AC.currentTime,.8);
  src.connect(g);g.connect(AC.destination);src.start();mus.src=src;mus.gain=g;
}
function duck(ms=2200){
  if(!mus.gain||!AC)return;const g=mus.gain,v=MUS_VOL[mus.cur]||.3,t=AC.currentTime;
  g.gain.cancelScheduledValues(t);g.gain.setTargetAtTime(v*.2,t,.08);g.gain.setTargetAtTime(v,t+ms/1000,.6);
}
document.addEventListener('pointerdown',()=>{ac();if(mus.want&&!mus.cur)playMusic(mus.want)},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume()});
function setMusic(on){P.musicOff=!on;save();if(!on)stopMusic();else{ac();if(mus.want)playMusic(mus.want)}}
function setSfx(on){P.sfxOff=!on;save();if(on){ac();sfx('tap')}}
function toast(t){if(!SPEED)return;const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
function comboText(t){sfx('combo',.7);const e=document.createElement('div');e.className='combo';e.textContent=t;$('board').appendChild(e);setTimeout(()=>e.remove(),900)}

function tone(f,d=.1,type='sine',v=.06,delay=0){if(!AC||!SPEED||P.sfxOff)return;const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.02)}

function confetti(n=90){
  if(!SPEED||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const box=document.createElement('div');box.className='confetti';document.body.appendChild(box);
  const cols=['#ff5a5a','#ffd23f','#4aa8ff','#7ed957','#ff8fd0','#ffffff','#ff9a3d'];
  for(let i=0;i<n;i++){const e=document.createElement('i');const w=6+Math.random()*7;
    Object.assign(e.style,{left:(Math.random()*100)+'%',width:w+'px',height:w*(1.4+Math.random()),background:cols[i%cols.length]});
    box.appendChild(e);
    e.animate([{transform:`translate(0,-10vh) rotate(0deg)`,opacity:1},{transform:`translate(${(Math.random()-.5)*160}px,${60+Math.random()*50}vh) rotate(${Math.random()*900-450}deg)`,opacity:1,offset:.85},{transform:`translate(${(Math.random()-.5)*200}px,110vh) rotate(${Math.random()*900}deg)`,opacity:0}],
      {duration:2200+Math.random()*1600,delay:Math.random()*500,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'})}
  setTimeout(()=>box.remove(),4600);
}
function rollNumbers(root){
  root.querySelectorAll('[data-roll]').forEach(el=>{const to=+el.dataset.roll,dur=900,t0=performance.now();let last=-1;
    const step=t=>{const k=Math.min(1,(t-t0)/dur),v=Math.round(to*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString('ru-RU');
      if(v!==last&&el.dataset.tick&&v%Math.max(1,Math.round(to/12))===0)tone(900+v%7*40,.03,'square',.02);last=v;if(k<1)requestAnimationFrame(step)};
    setTimeout(()=>requestAnimationFrame(step),550)});
}

const Analytics={buf:[],track(ev,params={}){
  const e={ev,t:Date.now(),...params};this.buf.push(e);if(this.buf.length>300)this.buf.shift();
  try{localStorage.setItem('lp-analytics',JSON.stringify(this.buf))}catch(x){}
  try{if(window.ym&&window.YM_ID)window.ym(window.YM_ID,'reachGoal',ev,params)}catch(x){}
  if(SPEED)console.debug('[analytics]',ev,params);
}};
try{Analytics.buf=JSON.parse(localStorage.getItem('lp-analytics'))||[]}catch(e){}
const track=(e,p)=>Analytics.track(e,p);

/* ---------- платформа: реклама и покупки (Яндекс Игры SDK или демо) ---------- */
function adPause(on){try{if(!AC)return;if(on)AC.suspend();else AC.resume()}catch(e){}}
function adOverlay(html){let o=$('adov');if(!o){o=document.createElement('div');o.id='adov';document.body.appendChild(o)}o.innerHTML=html;o.hidden=false;return o}
function demoAd(kind,cb){
  if(!SPEED)return cb();
  adPause(true);let n=kind==='rewarded'?3:2;
  const o=adOverlay(`<div class="adbox"><div class="adtag">Реклама · демо</div><div class="adnum" id="adNum">${n}</div><p>${kind==='rewarded'?'В релизе здесь будет короткое видео. После него игрок получает награду.':'В релизе здесь будет реклама между уровнями (не чаще раза в 2–3 минуты).'}</p></div>`);
  const tm=setInterval(()=>{n--;const e=$('adNum');if(e)e.textContent=n;if(n<=0){clearInterval(tm);o.hidden=true;adPause(false);cb()}},700);
}
function demoBuy(id,rub,done){
  if(!SPEED)return done(true);
  const pr=PRODUCTS[id];
  const o=adOverlay(`<div class="adbox buy"><div class="adtag">Покупка · демо</div><h3>${pr.name}</h3><div class="adprice">${rub}</div><p>В релизе здесь откроется оплата через площадку. В прототипе покупка бесплатная, чтобы её можно было проверить.</p>
    <div class="row"><button class="btn" id="dbNo">Отмена</button><button class="btn main" id="dbYes">Получить (демо)</button></div></div>`);
  $('dbNo').onclick=()=>{o.hidden=true;done(false)};$('dbYes').onclick=()=>{o.hidden=true;done(true)};
}
// Площадка: Пикабу Игры (PkbSDK), Яндекс Игры (YaGames) или демо. Пикабу открывает игру в iframe с ?_platform-key=pikabu / pikabu=true
const QS=new URLSearchParams(location.search);
const PIKABU=QS.get('_platform-key')==='pikabu'||QS.get('pikabu')==='true'||window.LP_PLATFORM==='pikabu';
if(PIKABU)document.documentElement.classList.add('pf-pikabu');
const progScore=d=>d&&Array.isArray(d.stars)?d.stars.reduce((a,b)=>a+(b||0),0)*100+(d.built||[]).length*10+((d.album||[]).length||0):-1;
const Platform={name:PIKABU?'pikabu':'demo',ysdk:null,payments:null,pk:null,prices:{},lastInter:0,interGap:150000,
  async init(){
    if(PIKABU)return this.initPikabu();
    if(!window.YaGames)return;
    try{this.ysdk=await window.YaGames.init();this.name='yandex';
      try{this.payments=await this.ysdk.getPayments({signed:false});const ps=await this.payments.getPurchases();for(const p of ps){if(p.productID==='noads')P.noAds=true}save()}catch(e){}
      try{this.ysdk.features.LoadingAPI.ready()}catch(e){}
    }catch(e){}
  },
  // ---- Пикабу: как в «Ночном тарифе»: SDK грузится с games.pikabu.ru, облачное сохранение, реклама через sdk.ads, покупки через sdk.store
  initPikabu(){
    this.interGap=4*60e3;   // площадка разрешает раз в 2 минуты, мы реже — чтобы не раздражать
    return this.pkReady=new Promise(res=>{
      const sc=document.createElement('script');sc.async=true;sc.src='https://games.pikabu.ru/sdk/sdk.js';
      sc.onload=async()=>{
        try{
          const sdk=await window.PkbSDK.init();this.pk=sdk;
          try{sdk.on('storageSaveError',r=>{track('pk_storage_error',{r:String(r)});if(r==='REVISION_CONFLICT'&&!this.pkDead){this.pkDead=true;toast('Прогресс изменён в другой вкладке — перезапусти игру, чтобы его не потерять')}})}catch(e){}
          try{sdk.on('userAuthorized',()=>this.pkCloudLoad())}catch(e){}
          this.pkCloudLoad();
          setTimeout(()=>this.pkStoreInit(),1500);
        }catch(e){track('pk_init_error',{e:String(e&&e.message||e).slice(0,80)})}
        res(this.pk);
      };
      sc.onerror=()=>{track('pk_init_error',{e:'script'});res(null)};
      document.head.appendChild(sc);setTimeout(()=>res(this.pk),15000);
    });
  },
  started(){if(this.pk&&!this.pkStarted){this.pkStarted=true;try{this.pk.gameStarted()}catch(e){}}},
  pkCloudLoad(){
    const sdk=this.pk;if(!sdk)return;let c=null;try{c=sdk.storage.get('lp')}catch(e){}
    if(c&&progScore(c.p)>progScore(P)){
      if(window.BOOTED&&!$('level').hidden){this.pkPending=c.p;return}
      this.pkApply(c.p);
    }else this.pkSave(true);
  },
  pkApply(d){P={...P,...d};this.pkPending=null;try{localStorage.setItem('lesnaya-pochta-v1',JSON.stringify(P))}catch(e){}
    P.built=(P.built||[]).filter(id=>ITEMS.some(i=>i.id===id));while(P.stars.length<LEVELS.length)P.stars.push(0);applyTisha();if(window.BOOTED&&$('level').hidden){closeOv();renderHome();toast('Прогресс загружен из облака Пикабу')}},
  pkSave(now){
    if(!this.pk||this.pkDead||this.pkPending)return;
    clearTimeout(this.pkT);this.pkT=setTimeout(()=>{try{this.pk.storage.set('lp',{v:1,t:Date.now(),p:P})}catch(e){}},now?0:2500);
  },
  async pkAd(kind){   // 'rewarded' | 'fullscreen' → {reward} или null, если показать нечего
    const sdk=this.pk||await this.pkReady;const ad=sdk&&sdk.ads&&sdk.ads[kind];
    if(!ad||!ad.isSupported)return null;
    try{if(!(await ad.canShow()))return null}catch(e){return null}
    adPause(true);
    try{const r=await ad.show();return r&&r.rendered?{reward:!!r.reward}:null}
    catch(e){return null}
    finally{adPause(false)}
  },
  async pkStoreInit(){
    const st=this.pk&&this.pk.store;if(!st)return;
    try{const list=await st.getProducts();for(const x of list||[])this.prices[x.id]=x.formattedPrice||(x.price/100)+' ₽'}catch(e){}
    try{const ps=await st.getPurchases();for(const x of ps||[])await this.pkGrant(x,false)}catch(e){}
  },
  // начисление по покупке: разовые наборы (noads, starter) — один раз, расходуемые — по purchaseId, затем consumePurchase
  async pkGrant(pc,loud){
    const id=pc.productId,pid=pc.purchaseId,pr=PRODUCTS[id];if(!pr)return false;
    P.pkGot=P.pkGot||[];
    const done=P.pkGot.includes(pid)||(!pr.consumable&&P.pkGot.includes('own:'+id));
    if(!done){pr.grant();P.pkGot.push(pid);if(!pr.consumable)P.pkGot.push('own:'+id);P.pkGot=P.pkGot.slice(-80);save();
      track('purchase',{id,rub:pr.rub,platform:'pikabu'});if(loud){sfx('win',.7);toast(pr.name+': готово!')}else toast(pr.name+': покупка зачислена')}
    if(pr.consumable){try{await this.pk.store.consumePurchase(pid)}catch(e){}}
    return !done;
  },
  price(id){return this.prices[id]||PRODUCTS[id].rub},
  rewarded(placement){
    track('ad_rewarded_request',{placement});
    return new Promise(res=>{
      const done=ok=>{adPause(false);if(ok)track('ad_rewarded',{placement});res(ok)};
      if(PIKABU){
        this.pkAd('rewarded').then(r=>{
          // нет рекламы — награда без неё (как в «Ночном тарифе»: игрок не виноват, что ролика нет)
          if(!r){toast('Реклама сейчас недоступна — награда без неё');track('ad_unavailable',{placement});return res(true)}
          if(r.reward)return done(true);
          toast('Награда — если досмотреть ролик до конца');done(false);
        });return;
      }
      if(this.ysdk){let got=false;try{this.ysdk.adv.showRewardedVideo({callbacks:{onOpen:()=>adPause(true),onRewarded:()=>{got=true},onClose:()=>done(got),onError:()=>done(false)}})}catch(e){done(false)}return}
      demoAd('rewarded',()=>done(true));
    });
  },
  interstitial(placement){
    return new Promise(res=>{
      if(P.noAds||Date.now()-this.lastInter<this.interGap)return res();
      this.lastInter=Date.now();
      if(PIKABU){this.pkAd('fullscreen').then(r=>{if(r)track('ad_interstitial',{placement});res()});return}
      track('ad_interstitial',{placement});
      if(this.ysdk){try{this.ysdk.adv.showFullscreenAdv({callbacks:{onOpen:()=>adPause(true),onClose:()=>{adPause(false);res()},onError:()=>{adPause(false);res()}}})}catch(e){res()}return}
      demoAd('inter',res);
    });
  },
  async pkBuy(id){
    const sdk=this.pk||await this.pkReady,st=sdk&&sdk.store;
    if(!st){toast('Магазин Пикабу ещё загружается — попробуй через пару секунд');return false}
    if(this.buying)return false;this.buying=true;
    try{
      if(sdk.player&&sdk.player.isAuthorized===false&&sdk.auth&&sdk.auth.openAuthDialog){
        toast('Войди в аккаунт Пикабу — после входа откроется оплата');
        try{await sdk.auth.openAuthDialog()}catch(e){}
        if(sdk.player.isAuthorized===false){toast('Для покупки нужно войти в аккаунт Пикабу');return false}
      }
      const r=await st.purchase({productId:id,developerPayload:JSON.stringify({from:'shop'})});
      if(!r||!r.success){const why=r&&r.reason;
        if(why==='NON_CONSUMABLE_ALREADY_OWNED'){toast('Уже куплено — возвращаю покупку');await this.pkStoreInit();return false}
        toast(why==='USER_CANCELLED'?'Покупка отменена':why==='USER_UNAUTHORIZED'?'Для покупки нужно войти в аккаунт Пикабу':'Покупка не прошла, попробуй ещё раз');
        track('purchase_cancel',{id,why:String(why||'')});return false}
      await this.pkGrant(r.purchase,true);return 'granted';
    }catch(e){toast('Покупка не прошла, попробуй ещё раз');return false}
    finally{this.buying=false}
  },
  buy(id,rub){
    track('purchase_request',{id});
    if(PIKABU)return this.pkBuy(id);
    return new Promise(res=>{
      const done=ok=>{if(ok)track('purchase',{id,rub});else track('purchase_cancel',{id});res(ok)};
      if(this.payments){this.payments.purchase({id}).then(pc=>{done(true);if(PRODUCTS[id].consumable&&pc&&pc.purchaseToken){try{this.payments.consumePurchase(pc.purchaseToken)}catch(e){}}}).catch(()=>done(false));return}
      demoBuy(id,rub,done);
    });
  },
};
function maybeInter(placement,next){if(P.stars.filter(Boolean).length<5)return next();Platform.interstitial(placement).then(next)}
const own=k=>{if(!(P.owned||[]).includes(k))P.owned=[...(P.owned||[]),k]};

function applyBoosts(){
  const normal=[];for(const row of grid)for(const t of row)if(t&&!t.stone&&!t.parcel&&!t.hero&&!t.lock&&!t.sp&&t.color>=0)normal.push(t);
  const pick=()=>normal.splice(Math.floor(Math.random()*normal.length),1)[0];
  for(const id of pendingBoost){if(invN(id)<=0)continue;invAdd(id,-1);track('booster_use',{id,level:LI+1});
    if(id==='moves3')moves+=3;
    else{const t=pick();if(t){t.sp=id==='bomb'?'bomb':(Math.random()<.5?'h':'v');renderTile(t);burst(t.r,t.c,t.color,10)}}}
  if(pendingBoost.size)toast('Бустеры на поле!');
  pendingBoost=new Set();save();updateHUD();
}

let DAILY=null;
const dayNum=d=>Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
function seeded(seed){let x=seed%2147483647;if(x<=0)x+=2147483646;return()=>(x=x*16807%2147483647)/2147483647}
function makeDaily(){
  const today=new Date(),dn=dayNum(today),rnd=seeded(dn*7919+13);
  const pets=[...new Set(LEVELS.filter(L=>L.pet).map(L=>L.pet))];
  const pet=pets[Math.floor(rnd()*pets.length)];
  const row=()=>Array(N).fill('.');const map=Array.from({length:N},row);
  const put=(r,c,ch)=>{if(map[r][c]==='.')map[r][c]=ch};
  const kinds=['colors','moss','ice','stones','parcels','hero'];const kind=kinds[Math.floor(rnd()*kinds.length)];
  let goals=[],moves=26,house=null,text='';
  const col=()=>Math.floor(rnd()*N);
  if(kind==='colors'){const a=Math.floor(rnd()*5);let b=(a+1+Math.floor(rnd()*4))%5;goals=[['c',a,22],['c',b,22]];text='Мне бы немного '+COLOR_NAME[a]+' и '+COLOR_NAME[b]+'. Поможешь?'}
  if(kind==='moss'){for(let r=5;r<8;r++)for(let c=0;c<N;c++)if(rnd()<.8)put(r,c,'m');goals=[['m']];moves=28;text='У моего домика всё заросло мхом. Расчистишь?'}
  if(kind==='ice'){for(let k=0;k<10;k++)put(2+Math.floor(rnd()*5),col(),'l');goals=[['l'],['c',Math.floor(rnd()*5),15]];text='Ночью подморозило, и мои вещи вмёрзли в лёд.'}
  if(kind==='stones'){for(let k=0;k<8;k++)put(1+Math.floor(rnd()*6),col(),rnd()<.3?'S':'s');goals=[['s']];moves=28;text='Камнепад! Помоги разобрать завал у моей норки.'}
  if(kind==='parcels'){put(0,1+Math.floor(rnd()*3),'p');put(0,4+Math.floor(rnd()*3),'p');goals=[['p'],['c',Math.floor(rnd()*5),15]];moves=30;text='Жду две посылки. Довезёшь их до низа поля?'}
  if(kind==='hero'){put(0,col(),'h');house=col();goals=[['h'],['c',Math.floor(rnd()*5),12]];moves=28;text='Тиша, загляни ко мне лично! Я жду внизу.'}
  const L={pet,name:PET_NAMES[pet],to:'дня · '+PET_NAMES[pet],text:'«'+text+'» — '+PET_NAMES[pet]+'.',moves,colors:5,goals,map:map.map(r=>r.join('')),house,daily:true,day:todayKey()};
  return L;
}
function dailyState(){

  const streak=(d.last===t||d.last===yk)?(d.streak||0):0;
  return {done:d.last===t,streak};
}

const toHex=t=>[...new TextEncoder().encode(t)].map(b=>b.toString(16).padStart(2,'0')).join('');
const fromHex=h=>{try{return new TextDecoder().decode(new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16))))}catch(e){return ''}};
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};

function loadImg(src){return imgCache[src]||(imgCache[src]=new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src}))}
function wrapText(ctx,text,x,y,maxW,lh,maxLines){
  const words=text.split(/\s+/);let line='',n=0;
  for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,y+n*lh);n++;line=w;if(n>=maxLines-1)break}else line=t}
  if(line&&n<maxLines)ctx.fillText(line,x,y+n*lh);
}

const cardLink=(pet,msg)=>GAME_URL+'#card-'+pet+'-'+toHex((msg||'').slice(0,60));
async function openPostcard(pet){

    <label class="pclabel" for="pcMsg">Подпись (необязательно)</label>

    document.querySelector('.pcsocial').remove();$('pcLink').remove();

  }
  const msgEl=$('pcMsg');

  };

  $('pcMore').onclick=()=>showShop('frames',()=>openPostcard(pet));

  };
  $('pcBack').onclick=()=>{$('card').innerHTML=prev;rebindWin()};
  if(!PIKABU)$('pcLink').addEventListener('focus',e=>e.target.select());
}
async function receivePostcard(code){
  const m=/^card-([a-z]+)-([0-9a-f]*)$/.exec(code);if(!m)return false;
  const pet=m[1],msg=fromHex(m[2]).slice(0,60);
  if(!PET_NAMES[pet])return false;
  const fresh=!(P.gifts||[]).includes(code);
  if(fresh){P.gifts=[...(P.gifts||[]),code].slice(-50);P.hammers++;P.shuffles++;save()}
  $('card').innerHTML=`<div class="to">Тебе пришло письмо</div><h2>${bi("postcard")} Открытка от друга!</h2><div class="pcwrap"><canvas id="pcIn"></canvas></div>
    ${fresh?'<p><b>Подарок:</b> молоток и перемешивание уже у тебя.</p>':'<p class="note">Подарок по этой открытке ты уже получил.</p>'}
    <div class="row"><button class="btn main" id="pcOk">${P.introSeen?'Играть':'Начать игру'} ▶</button></div>`;
  openOv();
  const cv=await drawPostcard(pet,msg);const pv=$('pcIn');pv.width=cv.width;pv.height=cv.height;pv.getContext('2d').drawImage(cv,0,0);
  $('pcOk').onclick=()=>{ac();closeOv();if(!P.introSeen)showIntroGate();else renderHome()};
  return true;
}

function noise(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}

  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.9,t+.05);g.gain.exponentialRampToValueAtTime(.001,t+2.4);s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
let rainNode=null;
function rainSound(on){if(!AC)return;if(on&&!P.sfxOff){if(rainNode)return;const s=AC.createBufferSource();s.buffer=noise(3);s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.5;const g=AC.createGain();g.gain.value=0;g.gain.setTargetAtTime(.12,AC.currentTime,.6);s.connect(f);f.connect(g);g.connect(AC.destination);s.start();rainNode={s,g}}
  else if(rainNode){const n=rainNode;rainNode=null;n.g.gain.setTargetAtTime(0,AC.currentTime,.5);setTimeout(()=>{try{n.s.stop()}catch(e){}},2500)}}
