<title>Короткое замыкание</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Rubik:wght@400;500;600&family=JetBrains+Mono:wght@500;800&display=swap">
<style>
/* Layout: one-screen game table on a printed circuit board — HUD strip, 5×5 board with entry arrows, side panel, hand tray. Single dark look by choice (solder mask). */
:root{
  --mask:#0b1d16;      /* solder mask, page ground */
  --mask-2:#11281f;    /* board surface */
  --mask-3:#183629;    /* raised panels */
  --trace:#2a5643;     /* traces, borders */
  --silk:#e9f0e7;      /* silkscreen text */
  --silk-dim:#8ea697;
  --copper:#d0894a;
  --copper-hi:#f4b979;
  --charge:#5cc6ff;    /* заряд */
  --mult:#ff5b3d;      /* множитель */
  --gold:#ffd166;      /* очки */
  --danger:#ff3b5c;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --cell:min(66px,calc((100vw - 72px) / 6.5));
  --gap:4px;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background-color:var(--mask);
  background-image:
    linear-gradient(var(--mask-2) 1px,transparent 1px),
    linear-gradient(90deg,var(--mask-2) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--silk);font-family:var(--body);font-size:14px;overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{
  max-width:980px;margin:0 auto;min-height:100%;box-sizing:border-box;
  padding-block:12px 20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;overflow-x:clip;
}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.1;align-self:center;margin-right:auto;text-wrap:balance}
.brand small{display:block;font-family:var(--mono);font-weight:500;font-size:10px;color:var(--copper);letter-spacing:.12em;text-transform:uppercase}
.stat{background:var(--mask-3);border:1px solid var(--trace);border-radius:8px;padding:6px 10px;min-width:64px}
.stat .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--silk-dim)}
.stat .v{font-family:var(--mono);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.stat.goal{flex:1 1 200px;min-width:180px}
.bar{height:6px;border-radius:3px;background:var(--mask);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--copper),var(--gold));transition:width .6s ease}
.v .of{color:var(--silk-dim);font-weight:500}
.money{color:var(--gold)}

/* table */
.table{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:760px){.table{grid-template-columns:minmax(0,1fr)}}
.board-wrap{padding-inline:calc(var(--cell) * .75);justify-self:center}
.board{
  position:relative;display:grid;grid-template-columns:repeat(5,var(--cell));gap:var(--gap);padding:8px;
  background:var(--mask-2);border:1px solid var(--trace);border-radius:12px;
  box-shadow:0 0 0 4px var(--mask),0 0 0 5px var(--trace);
}
.board.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}
.cell{
  width:var(--cell);height:var(--cell);border-radius:7px;position:relative;
  background:radial-gradient(circle at 50% 50%,var(--trace) 0 3px,transparent 4px),var(--mask);
  border:1px dashed var(--mask-3);box-sizing:border-box;transition:box-shadow .2s,background-color .2s;
}
.cell.can{border-color:var(--copper);cursor:pointer}
.cell.lit{box-shadow:inset 0 0 0 2px var(--copper-hi),0 0 14px -2px var(--copper)}
.cell .tile{position:absolute;inset:-1px;width:auto;height:auto}
.cell.blocked{background:repeating-linear-gradient(45deg,var(--mask) 0 6px,color-mix(in srgb,var(--danger) 22%,var(--mask)) 6px 9px);border-color:color-mix(in srgb,var(--danger) 45%,var(--trace))}
.boss{border-color:color-mix(in srgb,var(--mult) 55%,var(--trace));background:color-mix(in srgb,var(--mult) 10%,var(--mask-3))}
.boss h3{color:var(--mult)}
.cell.burnt .tile{filter:grayscale(1) brightness(.5)}

/* tiles */
.tile{
  width:var(--cell);height:var(--cell);border-radius:7px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  border:1px solid var(--trace);background:var(--mask-3);user-select:none;position:relative;
  transition:transform .12s,box-shadow .12s;
}
.tile .f{font-family:var(--mono);font-weight:800;font-size:calc(var(--cell) * .3);line-height:1;display:flex;align-items:center;justify-content:center;height:55%}
.tile .f svg{display:block;height:calc(var(--cell) * .44);width:calc(var(--cell) * .44)}
.tile .n{font-size:9px;letter-spacing:.04em;color:var(--silk-dim);white-space:nowrap}
.tile.k-charge{border-color:color-mix(in srgb,var(--charge) 55%,var(--trace));background:color-mix(in srgb,var(--charge) 12%,var(--mask-3))}
.tile.k-mult{border-color:color-mix(in srgb,var(--mult) 55%,var(--trace));background:color-mix(in srgb,var(--mult) 12%,var(--mask-3))}
.tile.k-route{border-color:color-mix(in srgb,var(--copper) 60%,var(--trace));background:color-mix(in srgb,var(--copper) 12%,var(--mask-3))}
.tile.k-swap{border-color:color-mix(in srgb,var(--gold) 55%,var(--trace));background:color-mix(in srgb,var(--gold) 10%,var(--mask-3))}
.tile.r1::after,.tile.r2::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--copper-hi)}
.tile.r2::after{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.c{color:var(--charge)} .m{color:var(--mult)} .r{color:var(--copper-hi)} .g{color:var(--gold)}
.tile.pop{animation:pop .28s}
@keyframes pop{40%{transform:scale(1.14);box-shadow:0 0 18px var(--copper-hi)}}

/* entry arrows */
.entry{
  position:absolute;width:calc(var(--cell) * .55);height:calc(var(--cell) * .55);margin:calc(var(--cell) * -.275) 0 0 calc(var(--cell) * -.275);
  border-radius:50%;border:1px solid var(--trace);background:var(--mask);color:var(--silk-dim);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;padding:0;
}
.entry.on{background:var(--copper);border-color:var(--copper-hi);color:var(--mask);box-shadow:0 0 12px var(--copper)}

/* pulses */
.layer{position:absolute;inset:0;pointer-events:none;z-index:3}
.dot{position:absolute;left:0;top:0;width:0;height:0;transition:transform var(--tick,200ms) linear}
.dot::before{content:"";position:absolute;width:14px;height:14px;left:-7px;top:-7px;border-radius:50%;background:#fff;box-shadow:0 0 6px 2px var(--gold),0 0 18px 6px var(--copper)}
.dot .lbl{position:absolute;left:0;top:-26px;transform:translateX(-50%);font-family:var(--mono);font-weight:800;font-size:11px;white-space:nowrap;background:var(--mask);border:1px solid var(--trace);border-radius:4px;padding:1px 4px}
.dot.gone{opacity:0;transition:transform var(--tick,200ms) linear,opacity .3s .1s}
.float{position:absolute;left:0;top:0;font-family:var(--mono);font-weight:800;font-size:14px;white-space:nowrap;text-shadow:0 1px 0 var(--mask),0 0 6px var(--mask);animation:rise .9s ease-out forwards;transform:translate(-50%,-50%)}
.float.big{font-size:20px;color:var(--gold)}
.float.bad{font-family:var(--display);font-size:13px;color:var(--danger)}
@keyframes rise{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-34px}}
.boom{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--danger);animation:boom .45s ease-out forwards}
@keyframes boom{to{transform:scale(7);opacity:0}}

/* side */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--mask-3);border:1px solid var(--trace);border-radius:10px;padding:12px 14px}
.panel h3{margin:0 0 6px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.info{min-height:56px;line-height:1.45;max-width:60ch}
.info b{font-weight:600}
.launchv{font-family:var(--mono);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;color:var(--gold)}
.launchv small{font-size:12px;color:var(--silk-dim);font-weight:500;display:block}
.mods{display:flex;flex-direction:column;gap:6px}
.mod{border-left:2px solid var(--gold);padding:2px 0 2px 8px}
.mod b{font-weight:600;font-size:13px}
.mod span{display:block;font-size:12px;color:var(--silk-dim)}
.empty{color:var(--silk-dim);font-size:12px}

/* tray */
.tray{display:flex;flex-direction:column;gap:10px;background:var(--mask-2);border:1px solid var(--trace);border-radius:12px;padding:12px}
.tray-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tray-top h3{margin:0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.deckc{font-size:12px;color:var(--silk-dim);font-family:var(--mono)}
.hand{display:flex;flex-wrap:wrap;gap:8px;min-height:var(--cell)}
.hand .tile{cursor:pointer}
.hand .tile:hover{transform:translateY(-3px)}
.hand .tile.sel{transform:translateY(-6px);box-shadow:0 0 0 2px var(--gold),0 6px 16px -4px var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:8px;border:1px solid var(--trace);background:var(--mask-3);padding:10px 14px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--copper)}
.btn:disabled{opacity:.4;cursor:default}
.btn.go{background:var(--copper);border-color:var(--copper-hi);color:var(--mask);font-family:var(--display);font-weight:800;letter-spacing:.03em;flex:1 1 160px}
.btn.go:hover:not(:disabled){background:var(--copper-hi)}
.btn.icon{padding:10px 12px}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--mask) 86%,transparent);backdrop-filter:blur(3px);
  overflow-y:auto;padding-block:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;justify-content:center}
.ov[hidden]{display:none}
.sheet{width:100%;max-width:720px;margin:auto;background:var(--mask-2);border:1px solid var(--trace);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.sheet h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,44px);line-height:1.05;text-wrap:balance}
.sheet h2{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(20px,4.5vw,28px);text-wrap:balance}
.sheet h3{margin:0;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.sheet p{margin:0;line-height:1.5;color:var(--silk-dim);max-width:62ch}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.45;max-width:62ch}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--copper)}
.demo{font-family:var(--mono);font-weight:800;font-size:clamp(18px,4vw,24px)}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.offer{display:flex;gap:10px;align-items:flex-start;background:var(--mask-3);border:1px solid var(--trace);border-radius:10px;padding:10px}
.offer .tile{flex:none}
.offer .txt{min-width:0;display:flex;flex-direction:column;gap:4px;flex:1}
.offer .txt b{font-weight:600}
.offer .txt span{font-size:12px;color:var(--silk-dim);line-height:1.4}
.offer .txt em{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--copper)}
.offer .btn{padding:6px 10px;align-self:flex-start;margin-top:2px}
.offer.sold{opacity:.35}
.deckrow{display:flex;flex-wrap:wrap;gap:6px}
.deckrow .tile{--cell:44px;cursor:pointer}
.deckrow .tile .n{font-size:7px}
.deckrow .tile:hover{box-shadow:0 0 0 2px var(--danger)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.reward{font-family:var(--mono);font-size:13px;color:var(--silk-dim);line-height:1.6}
.reward b{color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 18px);transform:translateX(-50%);z-index:30;background:var(--gold);color:var(--mask);font-family:var(--display);font-weight:800;padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px -6px var(--gold);white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  .board.shake{animation:none}
  .tile.pop{animation:none}
  .float{animation-duration:.01s}
}
</style>

<div class="app" id="app">
  <header class="hud">
    <div class="brand">Короткое замыкание<small>прототип · v0.2</small></div>
    <div class="stat"><div class="k">Раунд</div><div class="v" id="hRound">1</div></div>
    <div class="stat goal"><div class="k">Счёт / цель</div><div class="v"><span id="hScore">0</span> <span class="of">/ <span id="hTarget">0</span></span></div><div class="bar"><i id="hBar"></i></div></div>
    <div class="stat"><div class="k">Запуски</div><div class="v" id="hLaunch">4</div></div>
    <div class="stat"><div class="k">Сбросы</div><div class="v" id="hDisc">3</div></div>
    <div class="stat"><div class="k">Деньги</div><div class="v money" id="hMoney">$4</div></div>
  </header>

  <main class="table">
    <section class="board-wrap">
      <div class="board" id="board"><div class="layer" id="layer"></div></div>
    </section>
    <aside class="side">
      <div class="panel boss" id="bossPanel" hidden><h3>Босс-раунд</h3><div id="bossTxt"></div></div>
      <div class="panel"><h3>Подсказка</h3><div class="info" id="info"></div></div>
      <div class="panel"><h3>Этот запуск</h3><div class="launchv" id="launchV">0<small>очков</small></div></div>
      <div class="panel"><h3>Модификаторы <span id="modCount">0/5</span></h3><div class="mods" id="mods"></div></div>
    </aside>
  </main>

  <footer class="tray">
    <div class="tray-top"><h3>Рука</h3><span class="deckc" id="deckC"></span></div>
    <div class="hand" id="hand"></div>
    <div class="actions">
      <button class="btn go" id="bLaunch">Запуск ⚡</button>
      <button class="btn" id="bBack">Убрать с поля</button>
      <button class="btn" id="bDiscard">Сбросить руку</button>
      <button class="btn icon" id="bSound" aria-label="Звук">🔊</button>
      <button class="btn icon" id="bHelp" aria-label="Правила">?</button>
    </div>
  </footer>
</div>

<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
const W=5,H=5,DX=[1,0,-1,0],DY=[0,1,0,-1];
const TARGETS=[60,140,280,500,850,1300,2000,3000,4500,6500];
const RAR=['обычная','необычная','редкая'];
const MAX_MODS=5;
const $=id=>document.getElementById(id);

let S=null;          // run state
let phase='menu';    // menu | play | anim | shop | over
let selected=-1;
let muted=false;
let shopState=null;

const has=m=>S&&S.mods.includes(m);
const up=k=>(S&&S.up&&S.up[k])||0;
function fmt(n){
  if(!isFinite(n))return '∞';
  const r=Math.round(n*10)/10;
  return Number.isInteger(r)?r.toLocaleString('ru-RU'):r.toLocaleString('ru-RU',{minimumFractionDigits:1,maximumFractionDigits:1});
}
const mirrorSvg=r=>`<svg viewBox="0 0 40 40" aria-hidden="true"><line x1="${r?8:32}" y1="8" x2="${r?32:8}" y2="32" stroke="currentColor" stroke-width="5" stroke-linecap="round"/></svg>`;
const splitSvg=()=>`<svg viewBox="0 0 40 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><path d="M4 20H20M20 6V34M15 11l5-5 5 5M15 29l5 5 5-5"/></svg>`;

/* ---------- детали ---------- */
const T={
  battery:{name:'Батарейка',sh:'Батарея',kind:'charge',rar:0,price:3,
    val:()=>4+3*up('battery')+(has('powerbank')?4:0),
    face(){return `<span class="c">+${this.val()}</span>`},
    desc(){return `+${this.val()} к заряду.`},
    apply(p){const v=this.val();p.charge+=v;return [['+'+v,'c']]}},
  coil:{name:'Катушка',sh:'Катушка',kind:'mult',rar:0,price:3,
    val:()=>2+up('coil'),
    face(){return `<span class="m">+${this.val()}</span>`},desc(){return `+${this.val()} к множителю.`},
    apply(p){const v=this.val();p.mult+=v;return [['+'+v,'m']]}},
  copper:{name:'Медный провод',sh:'Медь',kind:'charge',rar:0,price:3,
    face:()=>'<span class="c">+Cu</span>',
    desc:()=>`+${(1+up('copper'))*(has('vein')?2:1)} к заряду за каждую медь на поле, включая эту. Ставь медь пачкой.`,
    apply(p,ctx){const v=ctx.copper*(1+up('copper'))*(has('vein')?2:1);p.charge+=v;return [['+'+v,'c']]}},
  mirror:{name:'Зеркало',sh:'Зеркало',kind:'route',rar:0,price:2,rot:true,
    face:t=>`<span class="r">${mirrorSvg(t?t.rot:0)}</span>`,
    desc:()=>'Поворачивает ток на 90°. Нажми на поставленное зеркало, чтобы развернуть его.'+(has('resonance')?' Резонанс: +2 к множителю.':''),
    apply(p,ctx,t){p.dir=(t.rot?[1,0,3,2]:[3,2,1,0])[p.dir];if(has('resonance')){p.mult+=2;return [['+2','m']]}return []}},
  lamp:{name:'Лампа',sh:'Лампа',kind:'charge',rar:1,price:4,
    face:()=>'<span class="c">+</span><span class="m">М</span>',desc:()=>'Добавляет к заряду текущий множитель импульса. Ставь после катушек.',
    apply(p){const v=Math.floor(p.mult);p.charge+=v;return [['+'+fmt(v),'c']]}},
  capacitor:{name:'Конденсатор',sh:'Конденс.',kind:'charge',rar:1,price:4,
    face:()=>'<span class="c">+↦</span>',desc:()=>'+1 к заряду за каждую клетку, которую импульс уже прошёл. Чем длиннее путь, тем лучше.',
    apply(p){p.charge+=p.steps;return [['+'+p.steps,'c']]}},
  fuse:{name:'Предохранитель',sh:'Предохр.',kind:'mult',rar:1,price:3,
    face:()=>'<span class="m">×3</span>',desc:()=>'×3 к множителю. Срабатывает один раз и сгорает навсегда.',
    apply(p,ctx,t){p.mult*=3;ctx.burn(t.uid);return [['×3','m']]}},
  reflector:{name:'Отражатель',sh:'Отражат.',kind:'route',rar:1,price:4,
    face:()=>'<span class="r">↺</span>',desc:()=>'Разворачивает ток назад и даёт +1 к множителю. Импульс ещё раз пройдёт через детали на своём пути.',
    apply(p){p.dir=(p.dir+2)%4;p.mult+=1;return [['+1','m']]}},
  splitter:{name:'Разветвитель',sh:'Развилка',kind:'route',rar:1,price:5,
    face:()=>`<span class="r">${splitSvg()}</span>`,
    desc:()=>'Делит импульс на два. Они уходят в стороны под 90°, и у каждого полный заряд и множитель.'+(has('parallel')?' Параллель: оба получают ×1,5 к множителю.':''),
    apply(p,ctx){const d=p.dir;p.dir=(d+1)%4;const c=ctx.clone(p,(d+3)%4);
      if(has('parallel')){p.mult*=1.5;if(c)c.mult*=1.5;return [['×1,5','m']]}return [['×2 импульса','r']]}},
  resistor:{name:'Резистор',sh:'Резистор',kind:'charge',rar:0,price:2,
    val:()=>6+4*up('resistor'),
    face(){return `<span class="c">+${this.val()}</span>`},desc(){return `+${this.val()} к заряду, но −1 к множителю (не меньше 1). Ставь в начале цепи.`},
    apply(p){const v=this.val();p.charge+=v;const had=p.mult;p.mult=Math.max(1,p.mult-1);return had>1?[['+'+v,'c'],['−1','m']]:[['+'+v,'c']]}},

    apply(p){const c=p.charge;p.charge=p.mult;p.mult=c;return [['⇄','g']]}},

function grow(uid){const d=S.deck.find(x=>x.uid===uid);if(d)d.lvl=(d.lvl||0)+1}

function tileHTML(t,extra=''){

  return `<div class="tile k-${d.kind} r${d.rar} ${extra}" data-uid="${t.uid}"><div class="f">${d.face(t)}</div><div class="n">${d.sh}</div></div>`;
}
function newTile(type){return {uid:S.nextUid++,type,rot:0}}
function plural(n,a,b,c){const m=n%10,h=n%100;return m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const target=r=>r<=TARGETS.length?TARGETS[r-1]:Math.round(TARGETS[TARGETS.length-1]*Math.pow(1.6,r-TARGETS.length)/10)*10;
const handSize=()=>7+(has('bighand')?1:0)-(boss('tight')?1:0);
const isBossRound=r=>r%3===0;
function loadBest(){try{return +localStorage.getItem('kz-best')||0}catch(e){return 0}}
function saveBest(v){try{localStorage.setItem('kz-best',String(v))}catch(e){}}

/* ---------- забег ---------- */
function newRun(){
  S={round:1,money:4,deck:[],mods:[],up:{},nextUid:1,best:0,totalScore:0,endless:false};
  for(const [t,n] of [['battery',4],['coil',4],['copper',2],['mirror',2]])for(let i=0;i<n;i++)S.deck.push(newTile(t));
  startRound();
}
function startRound(){
  S.target=target(S.round);
  S.boss=null;S.blocked=[];
  if(isBossRound(S.round)){
    const keys=Object.keys(BOSSES).filter(k=>k!==S.lastBoss);
    S.boss=keys[Math.floor(Math.random()*keys.length)];S.lastBoss=S.boss;
    if(S.boss==='static'){const all=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++)all.push(x+','+y);S.blocked=shuffle(all).slice(0,2)}
  }
  S.launches=4+(has('extra')?1:0)-(boss('short')?1:0);
  S.discards=boss('nodisc')?0:3;S.score=0;S.entry=2;
  S.board=Array.from({length:H},()=>Array(W).fill(null));
  S.draw=shuffle(S.deck.map(t=>({...t,rot:0})));S.pile=[];S.hand=[];
  drawUp();
  phase='play';selected=-1;closeOv();
  const lw=plural(S.launches,'запуск','запуска','запусков');
  setInfo(S.boss?`<b class="m">Босс-раунд: ${BOSSES[S.boss].name}.</b> ${BOSSES[S.boss].desc} Набери ${fmt(S.target)} очков за ${S.launches} ${lw}.`
    :`<b>Раунд ${S.round}.</b> Набери ${fmt(S.target)} очков за ${S.launches} ${lw}.`);
  if(S.boss)toast('Босс: '+BOSSES[S.boss].name);
  renderAll();
}
function drawUp(){
  while(S.hand.length<handSize()){
    if(!S.draw.length){if(!S.pile.length)break;S.draw=shuffle(S.pile);S.pile=[]}
    S.hand.push(S.draw.pop());
  }
}

/* ---------- симуляция ---------- */
function simulate(){
  let copper=0;
  for(const row of S.board)for(const c of row)if(c&&c.type==='copper')copper++;
  const pulses=[];let pid=0;
  const mk=(x,y,dir,charge,mult,steps,seen)=>{const p={id:pid++,x,y,dir,charge,mult,steps,seen,alive:true,trig:0};pulses.push(p);return p};
  mk(-1,S.entry,0,1,boss('dim')?0.5:1,0,new Set());
  const burned=new Set();
  const frames=[];let total=0,best=0,shorts=0;
  const snap=(p,fx,fy,state)=>({id:p.id,fx,fy,x:p.x,y:p.y,charge:p.charge,mult:p.mult,state});
  for(let t=0;t<400;t++){
    const alive=pulses.filter(p=>p.alive);
    if(!alive.length)break;
    const fr={pulses:[],events:[],lit:[],flash:[]};
    const born=[];
    const ctx={copper,burn:u=>burned.add(u),
      clone:(p,dir)=>{if(pulses.length+born.length>=48)return null;
        const c={id:pid++,x:p.x,y:p.y,dir,charge:p.charge,mult:p.mult,steps:p.steps,seen:new Set(p.seen),alive:true,trig:p.trig};born.push(c);return c}};
    for(const p of alive){
      const fx=p.x,fy=p.y;
      p.x+=DX[p.dir];p.y+=DY[p.dir];
      if(p.x<0||p.y<0||p.x>=W||p.y>=H){
        p.alive=false;
        let s=p.charge*p.mult;if(has('finish')&&p.dir===0)s*=2;s=Math.floor(s);
        total+=s;best=Math.max(best,s);
        fr.events.push({k:'exit',x:p.x,y:p.y,s,right:has('finish')&&p.dir===0});
        fr.pulses.push(snap(p,fx,fy,'exit'));continue;
      }
      const key=p.x+','+p.y+','+p.dir;
      if(p.seen.has(key)){
        p.alive=false;shorts++;
        let s=0;if(has('insulation')){s=Math.floor(p.charge*p.mult);total+=s;best=Math.max(best,s)}
        fr.events.push({k:'short',x:p.x,y:p.y,s});
        fr.pulses.push(snap(p,fx,fy,'short'));continue;
      }
      p.seen.add(key);
      fr.lit.push([p.x,p.y]);
      const cell=S.board[p.y][p.x];
      if(!cell){
        if(has('supercond')){p.charge+=1;fr.events.push({k:'fx',x:p.x,y:p.y,txt:'+1',c:'c'})}
      }else if(boss('ground')&&p.trig===0){
        p.trig++;fr.events.push({k:'fx',x:p.x,y:p.y,txt:'заземлено',c:'r'});
      }else if(cell.type==='fuse'&&burned.has(cell.uid)){
        fr.events.push({k:'fx',x:p.x,y:p.y,txt:'сгорел',c:'r'});
      }else{
        const d=T[cell.type];
        const times=(has('echo')&&p.trig===0&&d.kind!=='route')?2:1;
        for(let i=0;i<times;i++){
          if(cell.type==='fuse'&&i>0)break;
          for(const [txt,c] of d.apply(p,ctx,cell))fr.events.push({k:'fx',x:p.x,y:p.y,txt:(i?'эхо ':'')+txt,c});
        }
        p.trig++;fr.flash.push([p.x,p.y]);
      }
      p.steps++;
      fr.pulses.push(snap(p,fx,fy,'move'));
    }
    for(const b of born){pulses.push(b);fr.pulses.push(snap(b,b.x,b.y,'move'))}
    frames.push(fr);
  }
  for(const p of pulses)if(p.alive){p.alive=false}
  return {frames,total,best,burned,shorts};
}

/* ---------- геометрия поля ---------- */
let G={pad:8,pitch:70,cell:66,top:8};
function measure(){
  const cs=$('board').querySelectorAll('.cell');
  if(cs.length<2)return;
  G={pad:cs[0].offsetLeft,top:cs[0].offsetTop,pitch:cs[1].offsetLeft-cs[0].offsetLeft,cell:cs[0].offsetWidth};
  document.querySelectorAll('.entry').forEach((e,y)=>{const [px,py]=pos(-1,y);e.style.left=px+'px';e.style.top=py+'px'});
}
const pos=(x,y)=>[G.pad+x*G.pitch+G.cell/2,G.top+y*G.pitch+G.cell/2];

/* ---------- отрисовка ---------- */
function buildBoard(){
  const b=$('board');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const c=document.createElement('div');c.className='cell';c.dataset.x=x;c.dataset.y=y;
    c.addEventListener('click',()=>cellClick(x,y));
    c.addEventListener('mouseenter',()=>{const t=S&&S.board[y][x];if(t)showTileInfo(t)});
    b.insertBefore(c,$('layer'));
  }
  for(let y=0;y<H;y++){
    const e=document.createElement('button');e.className='entry';e.textContent='▶';e.setAttribute('aria-label','Вход тока, ряд '+(y+1));
    e.addEventListener('click',()=>{if(phase!=='play')return;S.entry=y;renderBoard();blip(330,.05)});
    b.appendChild(e);
  }
  measure();
}
function renderBoard(){
  const cells=$('board').querySelectorAll('.cell');
  cells.forEach(c=>{
    const x=+c.dataset.x,y=+c.dataset.y,t=S.board[y][x];
    const bl=S.blocked&&S.blocked.includes(x+','+y);
    c.innerHTML=t?tileHTML(t):'';
    c.classList.toggle('blocked',!!bl);
    c.classList.toggle('can',phase==='play'&&selected>=0&&!t&&!bl);
  });
  document.querySelectorAll('.entry').forEach((e,y)=>e.classList.toggle('on',y===S.entry));
}
function renderHand(){
  const h=$('hand');
  h.innerHTML=S.hand.map((t,i)=>tileHTML(t,i===selected?'sel':'')).join('')||'<span class="empty">Рука пуста. Нажми «Запуск».</span>';
  h.querySelectorAll('.tile').forEach((el,i)=>{
    el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',T[S.hand[i].type].name);
    el.addEventListener('click',()=>handClick(i));
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();handClick(i)}});
    el.addEventListener('mouseenter',()=>showTileInfo(S.hand[i]));
  });
  $('deckC').textContent=`в колоде ${S.draw.length} · в сбросе ${S.pile.length} · всего ${S.deck.length}`;
}
function renderHUD(){
  $('hRound').innerHTML=S.round+(S.round<=TARGETS.length?'/'+TARGETS.length:'')+(S.boss?' <span class="m">☠</span>':'');
  $('hScore').textContent=fmt(S.score);
  $('hTarget').textContent=fmt(S.target);
  $('hBar').style.width=Math.min(100,S.score/S.target*100)+'%';
  $('hLaunch').textContent=S.launches;
  $('hDisc').textContent=S.discards;
  $('hMoney').textContent='$'+S.money;
  const busy=phase!=='play';
  $('bLaunch').disabled=busy;
  $('bDiscard').disabled=busy||S.discards<=0||!S.hand.length;
  $('bBack').disabled=busy||!S.board.some(r=>r.some(Boolean));
}
function renderMods(){
  $('modCount').textContent=`${S.mods.length}/${MAX_MODS}`;
  $('mods').innerHTML=S.mods.length?S.mods.map(m=>`<div class="mod"><b>${M[m].name}</b><span>${M[m].desc}</span></div>`).join(''):'<span class="empty">Пока нет. Покупаются в магазине между раундами.</span>';
}
function renderBoss(){
  $('bossPanel').hidden=!S.boss;
  if(S.boss)$('bossTxt').innerHTML=`<b>${BOSSES[S.boss].name}</b><br><span class="empty">${BOSSES[S.boss].desc}</span>`;
}
function renderAll(){renderBoss();renderHUD();renderBoard();renderHand();renderMods()}
function setInfo(h){$('info').innerHTML=h}
function showTileInfo(t){const d=T[t.type];setInfo(`<b>${d.name}</b> · <span class="r">${RAR[d.rar]}</span><br>${d.desc(t)}`)}

/* ---------- ввод ---------- */
function handClick(i){
  if(phase!=='play')return;
  selected=selected===i?-1:i;
  if(selected>=0){showTileInfo(S.hand[i]);blip(520,.04)}
  renderBoard();renderHand();
}
function cellClick(x,y){
  if(phase!=='play')return;
  const cur=S.board[y][x];
  if(S.blocked&&S.blocked.includes(x+','+y)){setInfo('Эта клетка закрыта помехами. Ток через неё проходит, но деталь сюда не поставить.');return}
  if(selected>=0){
    const t=S.hand.splice(selected,1)[0];
    if(cur){cur.rot=0;S.hand.splice(selected,0,cur)}
    S.board[y][x]=t;selected=-1;blip(660,.05);
  }else if(cur){
    if(T[cur.type].rot&&cur.rot===0){cur.rot=1;blip(440,.04)}
    else{cur.rot=0;S.board[y][x]=null;S.hand.push(cur);blip(300,.04)}
    showTileInfo(cur);
  }else return;
  renderAll();
}
function backAll(){
  if(phase!=='play')return;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=S.board[y][x];if(t){t.rot=0;S.hand.push(t);S.board[y][x]=null}}
  selected=-1;renderAll();
}
function discardHand(){
  if(phase!=='play'||S.discards<=0)return;
  S.pile.push(...S.hand);S.hand=[];S.discards--;selected=-1;drawUp();blip(220,.08,'triangle');renderAll();
}

/* ---------- анимация запуска ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function floatAt(x,y,txt,cls){
  const [px,py]=pos(x,y);const f=document.createElement('div');
  f.className='float '+cls;f.textContent=txt;f.style.left=px+'px';f.style.top=(py-G.cell*.55)+'px';
  $('layer').appendChild(f);setTimeout(()=>f.remove(),950);
}
function cellEl(x,y){return $('board').querySelector(`.cell[data-x="${x}"][data-y="${y}"]`)}
async function launch(){
  if(phase!=='play')return;
  if(!S.board.some(r=>r.some(Boolean))){setInfo('Поставь на поле хотя бы одну деталь: выбери её в руке и нажми на клетку.');return}
  phase='anim';selected=-1;renderAll();
  measure();
  const sim=simulate();
  const layer=$('layer');const dots=new Map();
  let lt=0;const lv=$('launchV');lv.innerHTML='0<small>очков</small>';
  for(let i=0;i<sim.frames.length;i++){
    const fr=sim.frames[i];
    const tick=reduced?60:Math.max(70,230-i*12);
    layer.style.setProperty('--tick',tick+'ms');
    for(const s of fr.pulses){
      let d=dots.get(s.id);
      if(!d){
        d=document.createElement('div');d.className='dot';d.innerHTML='<span class="lbl"></span>';
        d.style.transition='none';const [ax,ay]=pos(s.fx,s.fy);d.style.transform=`translate(${ax}px,${ay}px)`;
        layer.appendChild(d);dots.set(s.id,d);void d.offsetWidth;d.style.transition='';
      }
      const [px,py]=pos(s.x,s.y);d.style.transform=`translate(${px}px,${py}px)`;
      if(s.state!=='move')d.classList.add('gone');
    }
    await sleep(tick);
    for(const [x,y] of fr.lit)cellEl(x,y).classList.add('lit');
    for(const [x,y] of fr.flash){const t=cellEl(x,y).querySelector('.tile');if(t){t.classList.remove('pop');void t.offsetWidth;t.classList.add('pop')}}
    let sounded=false;
    for(const e of fr.events){
      if(e.k==='fx'){floatAt(e.x,e.y,e.txt,e.c);if(!sounded){blip(e.c==='m'?520+Math.min(i*30,700):380+Math.min(i*20,500),.06);sounded=true}}
      else if(e.k==='exit'){
        lt+=e.s;floatAt(Math.max(-0.6,Math.min(W-0.4,e.x)),Math.max(-0.6,Math.min(H-0.4,e.y)),'+'+fmt(e.s)+(e.right?' ×2':''),'big');
        chord();lv.innerHTML=fmt(lt)+'<small>очков</small>';
      }else if(e.k==='short'){
        const [px,py]=pos(e.x,e.y);const b=document.createElement('div');b.className='boom';b.style.left=px+'px';b.style.top=py+'px';
        layer.appendChild(b);setTimeout(()=>b.remove(),500);
        floatAt(e.x,e.y,e.s?'ЗАМЫКАНИЕ +'+fmt(e.s):'ЗАМЫКАНИЕ!','bad');
        if(e.s){lt+=e.s;lv.innerHTML=fmt(lt)+'<small>очков</small>'}
        const bd=$('board');bd.classList.remove('shake');void bd.offsetWidth;bd.classList.add('shake');buzz();
      }
    }
    for(const s of fr.pulses){
      const d=dots.get(s.id);if(!d)continue;
      d.querySelector('.lbl').innerHTML=`<span class="c">${fmt(s.charge)}</span>×<span class="m">${fmt(s.mult)}</span>`;
      if(s.state!=='move')setTimeout(()=>{d.remove()},400);
    }
  }
  await sleep(650);
  layer.querySelectorAll('.dot').forEach(d=>d.remove());
  finishLaunch(sim);
}
function finishLaunch(sim){
  S.score+=sim.total;S.totalScore+=sim.total;
  if(sim.best>S.best)S.best=sim.best;
  if(sim.best>loadBest())saveBest(sim.best);
  // сгоревшие предохранители уходят из колоды
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const t=S.board[y][x];if(!t)continue;
    if(sim.burned.has(t.uid))S.deck=S.deck.filter(d=>d.uid!==t.uid);
    else{t.rot=0;S.pile.push(t)}
    S.board[y][x]=null;
  }
  $('board').querySelectorAll('.cell.lit').forEach(c=>c.classList.remove('lit'));
  S.launches--;
  const note=[];
  if(sim.shorts)note.push(`Короткое замыкание: сгорело импульсов — ${sim.shorts}.`);
  if(sim.burned.size)note.push(`Предохранитель сгорел и ушёл из колоды.`);
  if(S.score>=S.target){
    phase='won';renderAll();toast('Цель набрана!');fanfare();
    setTimeout(()=>{ if(S.round===TARGETS.length&&!S.endless)showVictory(); else openShop(); },1100);
    return;
  }
  if(S.launches<=0){phase='over';renderAll();setTimeout(showGameOver,500);return}
  drawUp();phase='play';
  setInfo(`Запуск принёс <b class="g">${fmt(sim.total)}</b>. До цели осталось ${fmt(S.target-S.score)}, запусков: ${S.launches}. ${note.join(' ')}`);
  renderAll();
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}

/* ---------- магазин ---------- */
function rollTile(){
  const r=Math.random(),rar=r<.5?0:r<.85?1:2;
  const pool=Object.keys(T).filter(k=>T[k].rar===rar);
  return pool[Math.floor(Math.random()*pool.length)];
}
function rollOffers(){
  const mods=shuffle(Object.keys(M).filter(m=>!S.mods.includes(m))).slice(0,2);
  shopState.tiles=[rollTile(),rollTile(),rollTile(),rollTile()].map(t=>({t,sold:false}));
  shopState.mods=mods.map(m=>({m,sold:false}));
  shopState.ups=shuffle(Object.keys(UPS)).slice(0,2).map(k=>({k,sold:false}));
}
function openShop(){
  phase='shop';
  const base=S.boss?7:4,left=S.launches,interest=Math.min(5,Math.floor(S.money/5)),inv=has('investor')?2:0;
  const reward=base+left+interest+inv;S.money+=reward;
  shopState={reroll:1,reward:{base,left,interest,inv,reward}};
  rollOffers();renderShop();
}
function renderShop(){
  const r=shopState.reward;
  const sh=$('sheet');
  sh.innerHTML=`
    <div><div class="kicker">Раунд ${S.round} пройден · ${fmt(S.score)} из ${fmt(S.target)}</div><h2>Магазин деталей</h2></div>
    <div class="reward">Награда: $${r.base} за ${S.boss?'босса':'раунд'} + $${r.left} за оставшиеся запуски + $${r.interest} проценты${r.inv?` + $${r.inv} инвестор`:''} = <b>$${r.reward}</b><br>У тебя: <b>$${S.money}</b></div>
    <h3>Детали в колоду</h3>
    <div class="offers">${shopState.tiles.map((o,i)=>{const d=T[o.t];return `
      <div class="offer ${o.sold?'sold':''}">${tileHTML({uid:0,type:o.t,rot:0})}
        <div class="txt"><em>${RAR[d.rar]}</em><b>${d.name}</b><span>${d.desc({uid:0})}</span>
        <button class="btn" data-bt="${i}" ${o.sold||S.money<d.price?'disabled':''}>${o.sold?'Куплено':'Купить $'+d.price}</button></div></div>`}).join('')}</div>
    <h3>Улучшения · навсегда</h3>
    <div class="offers">${shopState.ups.map((o,i)=>{const d=UPS[o.k],pr=upPrice(o.k);return `
      <div class="offer ${o.sold?'sold':''}">${tileHTML({uid:0,type:o.k,rot:0})}<div class="txt"><em>улучшение · ур. ${up(o.k)+1}</em><b>${d.name}</b><span>${d.txt}</span>
        <button class="btn" data-bu="${i}" ${o.sold||S.money<pr?'disabled':''}>${o.sold?'Куплено':'Купить $'+pr}</button></div></div>`}).join('')}</div>
    <h3>Модификаторы · ${S.mods.length}/${MAX_MODS}</h3>
    <div class="offers">${shopState.mods.length?shopState.mods.map((o,i)=>{const d=M[o.m];return `
      <div class="offer ${o.sold?'sold':''}"><div class="txt"><em>модификатор</em><b>${d.name}</b><span>${d.desc}</span>
        <button class="btn" data-bm="${i}" ${o.sold||S.money<d.price||S.mods.length>=MAX_MODS?'disabled':''}>${o.sold?'Куплено':S.mods.length>=MAX_MODS?'Нет места':'Купить $'+d.price}</button></div></div>`}).join(''):'<span class="empty">Ты собрал все модификаторы.</span>'}</div>
    <div class="row"><button class="btn" id="bReroll" ${S.money<shopState.reroll?'disabled':''}>Обновить витрину · $${shopState.reroll}</button></div>
    <h3>Твоя колода · ${S.deck.length} деталей · нажми, чтобы продать за $1</h3>
    <div class="deckrow">${S.deck.map(t=>tileHTML(t)).join('')}</div>
    <div class="row"><button class="btn go" id="bNext">${isBossRound(S.round+1)?'☠ Босс-раунд':'Раунд'} ${S.round+1}: цель ${fmt(target(S.round+1))} →</button></div>`;
  sh.querySelectorAll('[data-bt]').forEach(b=>b.addEventListener('click',()=>{
    const o=shopState.tiles[+b.dataset.bt],d=T[o.t];if(o.sold||S.money<d.price)return;
    S.money-=d.price;S.deck.push(newTile(o.t));o.sold=true;coin();renderShop();}));
  sh.querySelectorAll('[data-bm]').forEach(b=>b.addEventListener('click',()=>{
    const o=shopState.mods[+b.dataset.bm],d=M[o.m];if(o.sold||S.money<d.price||S.mods.length>=MAX_MODS)return;
    S.money-=d.price;S.mods.push(o.m);o.sold=true;coin();renderShop();renderMods();}));
  sh.querySelectorAll('[data-bu]').forEach(b=>b.addEventListener('click',()=>{
    const o=shopState.ups[+b.dataset.bu],pr=upPrice(o.k);if(o.sold||S.money<pr)return;
    S.money-=pr;S.up[o.k]=up(o.k)+1;o.sold=true;coin();renderShop();}));
  sh.querySelector('#bReroll').addEventListener('click',()=>{if(S.money<shopState.reroll)return;S.money-=shopState.reroll;shopState.reroll++;rollOffers();blip(400,.05);renderShop()});
  sh.querySelectorAll('.deckrow .tile').forEach(el=>el.addEventListener('click',()=>{
    if(S.deck.length<=6){toast('Колода не меньше 6 деталей');return}
    const u=+el.dataset.uid;S.deck=S.deck.filter(t=>t.uid!==u);S.money+=1;coin();renderShop();}));
  sh.querySelector('#bNext').addEventListener('click',()=>{S.round++;startRound()});
  openOv();renderHUD();
}

/* ---------- экраны ---------- */
function openOv(){$('ov').hidden=false;$('ov').scrollTop=0}
function closeOv(){$('ov').hidden=true}
function rulesHTML(){return `
  <ul class="rules">
    <li>Выбери деталь в руке и нажми на клетку поля. Ток входит слева, в ряд со светящейся стрелкой. Стрелку можно переключить.</li>
    <li>Импульс начинает с <span class="c">заряда 1</span> и <span class="m">множителя 1</span>. Каждая деталь на пути их меняет: <span class="c">синие</span> числа для заряда, <span class="m">красные</span> для множителя.</li>
    <li>Когда импульс уходит за край поля, он приносит <b class="g">заряд × множитель</b> очков.</li>
    <li>Если импульс пойдёт по кругу, случится короткое замыкание и он сгорит без очков.</li>
    <li>Набери цель раунда за 4 запуска. После раунда покупай детали и модификаторы на заработанные деньги.</li>
    <li>Каждый третий раунд — босс со своим особым правилом. За победу над боссом платят больше.</li>
  </ul>`}
function showStart(){
  phase='menu';
  const best=loadBest();
  $('sheet').innerHTML=`
    <div class="kicker">Роглайт о сборке схем · прототип</div>
    <h1>Короткое замыкание</h1>
    <p>Собирай схему из батареек, катушек, зеркал и усилителей. Пусти ток и смотри, как числа разгоняются до тысяч.</p>
    <div class="demo"><span class="c">9</span> × <span class="m">5</span> → ×2 → <span class="g">90</span> → … → <span class="g">12 000</span></div>
    ${rulesHTML()}
    ${best?`<p>Твой лучший импульс: <b class="g">${fmt(best)}</b></p>`:''}
    <div class="row"><button class="btn go" id="bPlay">Играть</button></div>`;
  $('bPlay').addEventListener('click',()=>{ac();newRun()});
  openOv();
}
function showHelp(){
  if(phase==='anim')return;
  const prev=phase;
  $('sheet').innerHTML=`<h2>Как играть</h2>${rulesHTML()}
    <p>Клавиши: 1–8 выбирают деталь, пробел запускает ток.</p>
    <div class="row"><button class="btn go" id="bClose">Понятно</button></div>`;
  $('bClose').addEventListener('click',()=>{if(prev==='shop')renderShop();else if(prev==='menu')showStart();else closeOv()});
  openOv();
}
function showGameOver(){
  const best=loadBest();
  $('sheet').innerHTML=`
    <div class="kicker">Схема разомкнута</div>
    <h1>Не хватило ${fmt(S.target-S.score)} очков</h1>
    <p>Раунд ${S.round}: набрано ${fmt(S.score)} из ${fmt(S.target)}.</p>
    <div class="reward">Лучший импульс в забеге: <b>${fmt(S.best)}</b><br>Рекорд импульса: <b>${fmt(best)}</b><br>Всего очков: <b>${fmt(S.totalScore)}</b></div>
    <div class="row"><button class="btn go" id="bAgain">Новый забег</button></div>`;
  $('bAgain').addEventListener('click',newRun);
  openOv();
}
function showVictory(){
  phase='over';
  $('sheet').innerHTML=`
    <div class="kicker">Все ${TARGETS.length} раундов пройдены</div>
    <h1>Схема собрана!</h1>
    <p>Лучший импульс в забеге: <b class="g">${fmt(S.best)}</b>. Можно продолжить в бесконечном режиме: цели растут в 1,6 раза каждый раунд.</p>
    <div class="row"><button class="btn go" id="bEndless">Бесконечный режим</button><button class="btn" id="bNew">Новый забег</button></div>`;
  $('bEndless').addEventListener('click',()=>{S.endless=true;openShop()});
  $('bNew').addEventListener('click',newRun);
  openOv();
}

/* ---------- звук ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function blip(f,d=.07,type='square',v=.04,delay=0){
  if(muted||!AC)return;
  const a=AC,o=a.createOscillator(),g=a.createGain(),t0=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.03);
}
const chord=()=>{blip(660,.15,'triangle',.06);blip(880,.15,'triangle',.05,.04);blip(1320,.2,'triangle',.04,.08)};
const buzz=()=>{blip(90,.3,'sawtooth',.07);blip(70,.3,'sawtooth',.05,.05)};
const coin=()=>{blip(988,.06,'square',.04);blip(1319,.12,'square',.04,.06)};
const fanfare=()=>[523,659,784,1047].forEach((f,i)=>blip(f,.18,'triangle',.06,i*.09));

/* ---------- запуск ---------- */
$('bLaunch').addEventListener('click',launch);
$('bBack').addEventListener('click',backAll);
$('bDiscard').addEventListener('click',discardHand);
$('bHelp').addEventListener('click',showHelp);
$('bSound').addEventListener('click',()=>{muted=!muted;$('bSound').textContent=muted?'🔇':'🔊';ac()});
document.addEventListener('keydown',e=>{
  if(phase!=='play'||!$('ov').hidden)return;
  if(e.code==='Space'&&e.target===document.body){e.preventDefault();launch()}
  const n=+e.key;if(n>=1&&n<=S.hand.length)handClick(n-1);
  if(e.key==='Escape'){selected=-1;renderBoard();renderHand()}
});
window.addEventListener('resize',measure);

function boot(data){
  buildBoard();
  if(data&&data.S){S=data.S;startRoundRestore();return}
  // демо-состояние под стартовым экраном
  S={round:1,money:4,deck:[],mods:[],up:{},nextUid:1,best:0,totalScore:0};
  newRun();showStart();
}
function startRoundRestore(){phase='play';selected=-1;closeOv();renderAll();setInfo('Забег восстановлен.')}
window.claude?.hot?.snapshot?.(()=>(phase==='play'&&S)?{S}:{});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(measure);
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
